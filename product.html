<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:220px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:5px;
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    height:180px;
    border-radius:5px;
}

.card h3{
    margin:10px 0;
}

.card p{
    color:#555;
}

.price{
    color:green;
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.btn{
    display:inline-block;
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:4px;
}

.btn:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

    <div class="card">
        <img src="https://via.placeholder.com/220x180" alt="Product">
        <h3>Wireless Mouse</h3>
        <p>Comfortable and smooth.</p>
        <div class="price">₹799</div>
        <a href="#" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/220x180" alt="Product">
        <h3>Keyboard</h3>
        <p>Mechanical keyboard.</p>
        <div class="price">₹1,299</div>
        <a href="#" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/220x180" alt="Product">
        <h3>Headphones</h3>
        <p>High-quality sound.</p>
        <div class="price">₹1,999</div>
        <a href="#" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/220x180" alt="Product">
        <h3>Smart Watch</h3>
        <p>Track your fitness.</p>
        <div class="price">₹2,999</div>
        <a href="#" class="btn">Buy Now</a>
    </div>

</div>

</body>
</html>
