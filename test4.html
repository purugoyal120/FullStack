<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            container-type: inline-size;
            container-name: parent;
            margin: auto;
            box-shadow: 0px 0px 10px 5px rgba(0,0,0,0.75);
            padding: 20px;
        }
        @container parent ( min-width: 500px ){
            .child{
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            <p>Resize the window to see the effect of container queries. When the parent container is at least 500px wide, the child div will turn red.</p>
        </div>
    </div>
</body>
</html>
