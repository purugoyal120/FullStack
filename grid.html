<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magazine Layout</title>

    <style>

        body {
            margin: 0;
        }

        .Header {
            display: grid;

            grid-template-columns: 2fr 1fr;

            grid-template-rows:
                80px
                300px
                150px
                60px;

            gap: 10px;

            padding: 10px;
        }
        .header {
            background-color: lightblue;

            grid-column: 1 / 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .featured {
            background-color: rgb(246, 255, 0);

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .right {
            display: grid;

            grid-template-rows: 1fr 1fr;

            gap: 10px;
        }

        .article {
            background-color: lightgray;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bottom {
            grid-column: 1 / 3;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;
        }

        .box {
            background-color: lightgreen;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer {
            background-color: lightblue;

            grid-column: 1 / 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (max-width: 768px) {
            .Header {
                grid-template-columns: 1fr;

                grid-template-rows:
                    80px
                    200px
                    200px
                    120px
                    60px;
            }
            .header {
                grid-column: 1;
            }

            .featured {
                grid-column: 1;
            }

            .right {
                grid-column: 1;
            }

            .bottom {
                grid-column: 1;

                grid-template-columns: repeat(2, 1fr);
            }

            .footer {
                grid-column: 1;
            }
        }
        @media (max-width: 480px) {

            .Header {
                grid-template-columns: 1fr;

                grid-template-rows:
                    70px
                    180px
                    120px
                    120px
                    120px
                    60px;
            }

            .right {
                grid-template-rows: 1fr 1fr;

                gap: 10px;
            }

            .bottom {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .featured h2 {
                font-size: 20px;
            }

        }

    </style>
</head>


<body>

    <div class="Header">

        <!-- Header -->

        <div class="header">
            <h1>Header</h1>
        </div>


        <!-- Featured -->

        <div class="featured">
            <h2>Sidebar</h2>
        </div>


        <!-- Articles -->

        <div class="right">

            <div class="article">
                Start
            </div>

            <div class="article">
                Start
            </div>

        </div>


        <!-- Bottom -->

        <div class="bottom">

            <div class="box">
                Recent Orders
            </div>

            <div class="box">
                Activity
            </div>

        </div>


        <!-- Footer -->

        <div class="footer">
            Footer
        </div>

    </div>

</body>

</html>
