<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            justify-content:space-evenly;
            outline:1px solid black;
            flex-direction:row;
            box-shadow: 0px 0px 10px 5px rgb(0, 0, 0);

        }
        .container>div{
            width:200px;
            color:white;
            background-color:rgb(11, 16, 18);
            align-content:center;
            text-align:center;
            height:100px;
            border:1px solid black;
            margin-left:10px;
            margin-bottom:10px;
            margin-top:10px;
            margin-right:10px;
            
        }
        #box1{
            background-color:rgb(221, 218, 11);
            flex: 2 0 150px;
        }
        #box2{
            background-color:rgb(27, 195, 63);
            flex:1 1 100px;
        }
        #box3{
            background-color:rgb(227, 70, 22);
            flex:3 1 200px;
        }

       </style>
</head>
<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div> 
        <div id="box3">Box 3</div> 
    </div>
   
</body>
</html>
