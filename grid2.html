<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            width: 500px;
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            outline:1px solid black;
            grid-template-columns: subgrid;
        }
        .container>div{
            outline:1px dashed grey;
            font-size:30px;
        }
        #box1{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        #box6{
            background-color:rgb(227, 70, 22);
            grid-column-start:2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
        }

       </style>

</head>
<body>
     <div class="parent">
        <div id="child">
            <div id="subchild">

            </div>
        </div>
     </div>
</body>
</html>
